<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Monitoring Bon Sementara</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #0f766e;
      --primary-hover: #115e59;
      --danger: #b91c1c;
      --warn: #b45309;
      --ok: #15803d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }
    .container { max-width: 1280px; margin: 0 auto; }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--card);
      padding: 16px 20px;
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }
    h1 { margin: 0; font-size: 18px; }
    .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    input, select, button {
      height: 36px;
      padding: 0 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 13px;
      background: #fff;
      color: var(--text);
    }
    button {
      background: var(--primary);
      color: #fff;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: var(--primary-hover); }
    button.secondary {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border);
    }
    button.secondary:hover { background: #f8fafc; }
    .grid-kpi {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .kpi {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
    }
    .kpi .label { font-size: 12px; color: var(--muted); }
    .kpi .val { font-size: 20px; font-weight: 700; margin-top: 6px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
    }
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }
    th, td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      white-space: nowrap;
    }
    th {
      background: #f8fafc;
      font-weight: 600;
      position: sticky;
      top: 0;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      background: #f1f5f9;
    }
    .status-msg {
      font-size: 12px;
      color: var(--muted);
      margin-top: 10px;
    }
    .err { color: var(--danger); font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>MONITORING BON SEMENTARA</h1>
        <div class="sub" id="infoSync">Belum dimuat</div>
      </div>
      <div class="toolbar">
        <input id="inputPin" type="password" placeholder="PIN (jika ada)" style="width:130px;" />
        <select id="filterStore">
          <option value="">Semua Store</option>
        </select>
        <select id="filterStatus">
          <option value="">Semua Status</option>
          <option value="Diajukan">Diajukan</option>
          <option value="Disetujui">Disetujui</option>
          <option value="Dicairkan">Dicairkan</option>
          <option value="Selesai">Selesai</option>
          <option value="Ditolak">Ditolak</option>
          <option value="Kedaluwarsa">Kedaluwarsa</option>
        </select>
        <button id="btnRefresh" type="button">Refresh Data</button>
        <button id="btnClearCache" type="button" class="secondary">Reset PIN</button>
      </div>
    </header>

    <div class="grid-kpi">
      <div class="kpi">
        <div class="label">Total Transaksi</div>
        <div class="val" id="kpiJumlah">0</div>
      </div>
      <div class="kpi">
        <div class="label">Total Nominal Ajuan</div>
        <div class="val" id="kpiNominal">Rp 0</div>
      </div>
      <div class="kpi">
        <div class="label">Belum Selesai / Gantung</div>
        <div class="val" id="kpiGantung">0</div>
      </div>
      <div class="kpi">
        <div class="label">Selesai</div>
        <div class="val" id="kpiSelesai">0</div>
      </div>
    </div>

    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Store</th>
              <th>Nama Store</th>
              <th>NIP</th>
              <th>Nama</th>
              <th>Keperluan</th>
              <th>Nominal</th>
              <th>Status</th>
              <th>Tgl Ajuan</th>
            </tr>
          </thead>
          <tbody id="tbodyData">
            <tr><td colspan="9">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="status-msg" id="statusBar"></div>
    </div>
  </div>

  <script>
    // Sesuaikan path endpoint jika Worker Anda memakai '/bon' atau '/api/bon'
    const ENDPOINT_BON = '/api/bon';
    const ENDPOINT_MASTER = '/api/master';

    let semuaData = [];
    let petaStore = {};

    // Parser CSV sederhana yang mendukung tanda kutip ganda
    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cur = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];

        if (ch === '"' && inQuotes && next === '"') {
          cur += '"';
          i++;
        } else if (ch === '"') {
          inQuotes = !inQuotes;
        } else if (ch === ',' && !inQuotes) {
          row.push(cur.trim());
          cur = '';
        } else if ((ch === '\n' || ch === '\r') && !inQuotes) {
          if (ch === '\r' && next === '\n') i++;
          row.push(cur.trim());
          if (row.some(cell => cell !== '')) rows.push(row);
          row = [];
          cur = '';
        } else {
          cur += ch;
        }
      }
      if (cur.length > 0 || row.length > 0) {
        row.push(cur.trim());
        if (row.some(cell => cell !== '')) rows.push(row);
      }
      if (rows.length < 2) return [];

      const headers = rows[0].map(h => h.replace(/^\uFEFF/, '').trim());
      return rows.slice(1).map(r => {
        const obj = {};
        headers.forEach((h, idx) => {
          obj[h] = r[idx] !== undefined ? r[idx] : '';
        });
        return obj;
      });
    }

    function formatRupiah(num) {
      const n = Number(String(num || 0).replace(/[^\d.-]/g, '')) || 0;
      return 'Rp ' + n.toLocaleString('id-ID');
    }

    function getPinQuery() {
      const pin = document.getElementById('inputPin').value.trim();
      if (pin) localStorage.setItem('dash_pin', pin);
      const savedPin = pin || localStorage.getItem('dash_pin') || '';
      return savedPin ? 'pin=' + encodeURIComponent(savedPin) : '';
    }

    async function muatMaster(forceRefresh = false) {
      try {
        const pinQ = getPinQuery();
        const extra = [];
        if (pinQ) extra.push(pinQ);
        if (forceRefresh) {
          extra.push('nocache=1');
          extra.push('t=' + Date.now());
        }
        const url = ENDPOINT_MASTER + (extra.length ? '?' + extra.join('&') : '');
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) return;

        const rows = parseCSV(await res.text());
        const map = {};
        rows.forEach(r => {
          const kode = String(r['Kode Store'] || r['KodeStore'] || r['Store'] || '').trim().toUpperCase();
          const nama = String(r['Nama Store'] || r['NamaStore'] || r['Nama'] || '').trim();
          if (kode) map[kode] = nama || kode;
        });
        petaStore = map;
      } catch (_) {
        // Master bersifat pelengkap tampilan nama store
      }
    }

    async function muatData(forceRefresh = false) {
      const statusBar = document.getElementById('statusBar');
      const infoSync = document.getElementById('infoSync');
      statusBar.className = 'status-msg';
      statusBar.textContent = forceRefresh ? 'Mengambil data terbaru (bypass cache)...' : 'Memuat data...';

      try {
        await muatMaster(forceRefresh);

        const pinQ = getPinQuery();
        const extra = [];
        if (pinQ) extra.push(pinQ);
        if (forceRefresh) {
          extra.push('nocache=1');
          extra.push('t=' + Date.now());
        }
        const url = ENDPOINT_BON + (extra.length ? '?' + extra.join('&') : '');

        const res = await fetch(url, { cache: 'no-store' });
        const text = await res.text();
        if (!res.ok) {
          throw new Error(text || ('Gagal memuat data (HTTP ' + res.status + ')'));
        }

        semuaData = parseCSV(text);
        isiFilterStore(semuaData);
        renderTampilan();

        const cacheStatus = res.headers.get('X-Cache-Status') || '-';
        const waktu = new Date().toLocaleTimeString('id-ID');
        infoSync.textContent = 'Terakhir diperbarui: ' + waktu + ' | Cache Edge: ' + cacheStatus;
        statusBar.textContent = 'Menampilkan ' + semuaData.length + ' baris data mentah dari sumber.';
      } catch (err) {
        statusBar.className = 'status-msg err';
        statusBar.textContent = 'Error: ' + (err.message || String(err));
        document.getElementById('tbodyData').innerHTML =
          '<tr><td colspan="9" class="err">Gagal memuat data. Periksa PIN atau URL CSV.</td></tr>';
      }
    }

    function isiFilterStore(rows) {
      const sel = document.getElementById('filterStore');
      const nilaiSekarang = sel.value;
      const kodeSet = new Set();

      rows.forEach(r => {
        const st = String(r['Store'] || r['KodeStore'] || '').trim().toUpperCase();
        if (st) kodeSet.add(st);
      });

      const sorted = Array.from(kodeSet).sort();
      sel.innerHTML = '<option value="">Semua Store (' + sorted.length + ')</option>' +
        sorted.map(k => '<option value="' + k + '">' + k + (petaStore[k] ? ' - ' + petaStore[k] : '') + '</option>').join('');

      if (sorted.includes(nilaiSekarang)) sel.value = nilaiSekarang;
    }

    function renderTampilan() {
      const storeDipilih = document.getElementById('filterStore').value;
      const statusDipilih = document.getElementById('filterStatus').value;

      const filtered = semuaData.filter(r => {
        const st = String(r['Store'] || r['KodeStore'] || '').trim().toUpperCase();
        const status = String(r['Status'] || '').trim();
        if (storeDipilih && st !== storeDipilih) return false;
        if (statusDipilih && status !== statusDipilih) return false;
        return true;
      });

      let totalNominal = 0;
      let totalGantung = 0;
      let totalSelesai = 0;

      filtered.forEach(r => {
        const nom = Number(String(r['Nominal'] || 0).replace(/[^\d.-]/g, '')) || 0;
        const status = String(r['Status'] || '').trim();
        totalNominal += nom;
        if (status === 'Selesai') totalSelesai++;
        if (status === 'Diajukan' || status === 'Disetujui' || status === 'Dicairkan') totalGantung++;
      });

      document.getElementById('kpiJumlah').textContent = filtered.length.toLocaleString('id-ID');
      document.getElementById('kpiNominal').textContent = formatRupiah(totalNominal);
      document.getElementById('kpiGantung').textContent = totalGantung.toLocaleString('id-ID');
      document.getElementById('kpiSelesai').textContent = totalSelesai.toLocaleString('id-ID');

      const tbody = document.getElementById('tbodyData');
      if (!filtered.length) {
        tbody.innerHTML = '<tr><td colspan="9">Tidak ada data yang sesuai dengan filter.</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map(r => {
        const kodeStore = String(r['Store'] || r['KodeStore'] || '').trim().toUpperCase();
        const namaStore = petaStore[kodeStore] || '-';
        return '<tr>' +
          '<td>' + esc(r['ID'] || '') + '</td>' +
          '<td>' + esc(kodeStore) + '</td>' +
          '<td>' + esc(namaStore) + '</td>' +
          '<td>' + esc(r['NIP'] || '') + '</td>' +
          '<td>' + esc(r['Nama'] || '') + '</td>' +
          '<td>' + esc(r['Keperluan'] || '') + '</td>' +
          '<td>' + esc(formatRupiah(r['Nominal'])) + '</td>' +
          '<td><span class="badge">' + esc(r['Status'] || '') + '</span></td>' +
          '<td>' + esc(r['TglAjuan'] || '') + '</td>' +
        '</tr>';
      }).join('');
    }

    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    document.getElementById('btnRefresh').addEventListener('click', () => muatData(true));
    document.getElementById('filterStore').addEventListener('change', renderTampilan);
    document.getElementById('filterStatus').addEventListener('change', renderTampilan);
    document.getElementById('btnClearCache').addEventListener('click', () => {
      localStorage.removeItem('dash_pin');
      document.getElementById('inputPin').value = '';
      muatData(true);
    });

    const savedPinInit = localStorage.getItem('dash_pin');
    if (savedPinInit) document.getElementById('inputPin').value = savedPinInit;

    muatData(false);
  </script>
</body>
</html>
